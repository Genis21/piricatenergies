<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panell de la Central — Piricat Energies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<header class="admin-header">
  <div class="brand">
    <span class="brand-mark">⚡</span>
    <div>
      Piricat Energies
      <small>Central · Sort, Pallars Sobirà</small>
    </div>
  </div>
  <div class="clock" id="rellotge">--:--:--</div>
</header>

<div class="admin-layout">

  <!-- Columna esquerra: graella de comarques -->
  <section>
    <div class="panel-title">
      <h2>Estat de les 6 comarques</h2>
      <span class="sub" id="resum-global">— carregant —</span>
    </div>
    <div class="comarques-grid" id="comarques-grid">
      <!-- Generat dinàmicament per central.js -->
    </div>
  </section>

  <!-- Columna dreta: formulari nou avís -->
  <aside>
    <div class="form-card">
      <h2>Registrar avís de client</h2>
      <p class="form-sub">En trucar el client, omple les dades i el sistema assignarà automàticament el tècnic segons la cua.</p>

      <form id="form-nou-tiquet">
        <div class="field">
          <label for="f-comarca">Comarca</label>
          <select id="f-comarca" required>
            <option value="">Selecciona la comarca…</option>
            <option value="aran">Val d'Aran</option>
            <option value="ribagorca">Alta Ribagorça</option>
            <option value="jussa">Pallars Jussà</option>
            <option value="sobira">Pallars Sobirà</option>
            <option value="urgell">Alt Urgell</option>
            <option value="andorra">Andorra</option>
          </select>
        </div>

        <div class="field">
          <label for="f-nom">Nom del client</label>
          <input type="text" id="f-nom" placeholder="Ex: Hostal Vall Ferrera" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="f-telefon">Telèfon</label>
            <input type="tel" id="f-telefon" placeholder="973 000 000" required>
          </div>
          <div class="field">
            <label for="f-poble">Poble</label>
            <input type="text" id="f-poble" placeholder="Ex: Sort">
          </div>
        </div>

        <div class="field">
          <label for="f-adreca">Adreça</label>
          <input type="text" id="f-adreca" placeholder="Carrer, número...">
        </div>

        <div class="field">
          <label for="f-tipus">Tipus d'avís</label>
          <select id="f-tipus">
            <option value="electricitat">Electricitat</option>
            <option value="lampisteria">Lampisteria</option>
            <option value="ambdos">Lampisteria + Electricitat</option>
          </select>
        </div>

        <div class="field">
          <label for="f-descripcio">Descripció de l'avaria</label>
          <textarea id="f-descripcio" placeholder="Explica breument el problema..."></textarea>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="f-urgent">
          Marcar com a urgent
        </label>

        <button type="submit" class="btn-submit" id="btn-crear">Registrar i assignar tècnic</button>
      </form>

      <div class="resposta-box" id="resposta-box"></div>
    </div>
  </aside>

</div>

<div class="toast" id="toast"></div>

<script src="js/central.js"></script>
</body>
</html>
